# Blockchain Enterprise 配置文件

# 存储路径
storage:
  db_path: "database/ledger.db"
  image_dir: "images"
  upload_temp_dir: "uploads"

# 密钥管理
security:
  public_key: "keys/public.key"

# 接口配置
server:
  host: "0.0.0.0"
  port: 8080
  debug: true
  log_file: "storage/audit.log" # 审计日志存放路径

# 业务规则
business:
  pagination_size: 6
  allowed_categories:
    - "固定资产"
    - "办公耗材"
    - "数码设备"
    - "SYSTEM"
